version: v2beta1

vars:
  APP_NAMESPACE: platform
  E2E_IMAGE: mcr.microsoft.com/playwright:v1.58.2-noble
  E2E_OIDC_REDIRECT_URI:

functions:
  disable_argocd_sync: |-
    if kubectl get application tracing-app -n argocd >/dev/null 2>&1; then
      echo "Disabling ArgoCD auto-sync for tracing-app..."
      kubectl patch application tracing-app -n argocd \
        --type merge \
        -p '{"spec":{"syncPolicy":{"automated":null}}}'
      echo "ArgoCD auto-sync disabled."
    else
      echo "WARNING: ArgoCD Application 'tracing-app' not found in argocd namespace."
    fi
  restore_argocd_sync: &restore_argocd_sync |-
    if kubectl get application tracing-app -n argocd >/dev/null 2>&1; then
      echo "Re-enabling ArgoCD auto-sync for tracing-app..."
      kubectl patch application tracing-app -n argocd \
        --type merge \
        -p '{"spec":{"syncPolicy":{"automated":{"prune":true,"selfHeal":true}}}}'
      echo "ArgoCD auto-sync restored."
    else
      echo "WARNING: ArgoCD Application 'tracing-app' not found in argocd namespace."
    fi
  deploy_pr_image: |-
    echo "Deploying PR image to tracing-app..."
    IMAGE="${PR_IMAGE:-}"
    if [ -z "$IMAGE" ]; then
      echo "ERROR: PR_IMAGE not set, aborting hot deploy"
      exit 1
    fi
    if [ ! -f docker/default.conf.template ]; then
      echo "ERROR: docker/default.conf.template not found"
      exit 1
    fi
    kubectl create configmap tracing-app-nginx -n ${APP_NAMESPACE} \
      --from-file=default.conf.template=docker/default.conf.template \
      --dry-run=client -o yaml | kubectl apply -f -

    read_chat_env() {
      python3 - "$1" "${APP_NAMESPACE}" <<'PY'
    import base64
    import json
    import subprocess
    import sys

    name = sys.argv[1]
    namespace = sys.argv[2]

    def load_json(args):
        return json.loads(subprocess.check_output(args))

    def read_from_value_from(value_from):
        if "configMapKeyRef" in value_from:
            ref = value_from["configMapKeyRef"]
            data = load_json(["kubectl", "get", "configmap", ref["name"], "-n", namespace, "-o", "json"]).get("data", {})
            return data.get(ref["key"])
        if "secretKeyRef" in value_from:
            ref = value_from["secretKeyRef"]
            data = load_json(["kubectl", "get", "secret", ref["name"], "-n", namespace, "-o", "json"]).get("data", {})
            raw = data.get(ref["key"])
            if raw is None:
                return None
            return base64.b64decode(raw).decode("utf-8")
        return None

    deployment = load_json(["kubectl", "get", "deployment", "chat-app", "-n", namespace, "-o", "json"])
    container = deployment["spec"]["template"]["spec"]["containers"][0]

    value = None
    for env in container.get("env", []):
        if env.get("name") == name:
            if "value" in env:
                value = env["value"]
            elif "valueFrom" in env:
                value = read_from_value_from(env["valueFrom"])
            break

    if value is None:
        for env_from in container.get("envFrom", []):
            if "configMapRef" in env_from:
                ref = env_from["configMapRef"]
                data = load_json(["kubectl", "get", "configmap", ref["name"], "-n", namespace, "-o", "json"]).get("data", {})
                if name in data:
                    value = data[name]
                    break
            if "secretRef" in env_from:
                ref = env_from["secretRef"]
                data = load_json(["kubectl", "get", "secret", ref["name"], "-n", namespace, "-o", "json"]).get("data", {})
                raw = data.get(name)
                if raw is not None:
                    value = base64.b64decode(raw).decode("utf-8")
                    break

    if value is None:
        sys.exit(1)

    print(value)
    PY
    }

    OIDC_AUTHORITY=$(read_chat_env OIDC_AUTHORITY)
    OIDC_CLIENT_ID=$(read_chat_env OIDC_CLIENT_ID)
    OIDC_SCOPE=$(read_chat_env OIDC_SCOPE)
    if [ -z "$OIDC_AUTHORITY" ] || [ -z "$OIDC_CLIENT_ID" ] || [ -z "$OIDC_SCOPE" ]; then
      echo "ERROR: Failed to read OIDC env vars from chat-app deployment"
      exit 1
    fi

    kubectl set env deployment/tracing-app -n ${APP_NAMESPACE} \
      API_BASE_URL=/api \
      OIDC_AUTHORITY="$OIDC_AUTHORITY" \
      OIDC_CLIENT_ID="$OIDC_CLIENT_ID" \
      OIDC_SCOPE="$OIDC_SCOPE"

    kubectl set image deployment/tracing-app tracing-app="$IMAGE" -n ${APP_NAMESPACE}
    kubectl rollout restart deployment/tracing-app -n ${APP_NAMESPACE}
    kubectl rollout status deployment/tracing-app -n ${APP_NAMESPACE} --timeout=120s
    echo "PR image deployed successfully"
  dump_seed_failure_logs: |-
    echo "=== GATEWAY LOGS ==="
    kubectl logs -n ${APP_NAMESPACE} -l app.kubernetes.io/name=gateway --all-containers --tail=200 || true
    echo "=== TRACING LOGS ==="
    kubectl logs -n ${APP_NAMESPACE} -l app.kubernetes.io/name=tracing --all-containers --tail=200 || true
    echo "=== TRACING SERVICE ==="
    kubectl get svc -n ${APP_NAMESPACE} tracing -o wide 2>/dev/null || true
    kubectl get endpoints -n ${APP_NAMESPACE} tracing -o wide 2>/dev/null || true
    echo "=== TRACING PODS ==="
    kubectl get pods -n ${APP_NAMESPACE} -l app.kubernetes.io/name=tracing -o wide 2>/dev/null || true
    for pod in $(kubectl get pods -n ${APP_NAMESPACE} -l app.kubernetes.io/name=tracing -o name 2>/dev/null); do
      echo "--- ${pod} ---"
      kubectl describe -n ${APP_NAMESPACE} "${pod}" 2>/dev/null || true
    done
    echo "=== K8S RUNNER LOGS ==="
    kubectl logs -n ${APP_NAMESPACE} -l app.kubernetes.io/name=k8s-runner --all-containers --tail=200 || true
    echo "=== AGENTS-ORCHESTRATOR LOGS ==="
    kubectl logs -n ${APP_NAMESPACE} -l app.kubernetes.io/name=agents-orchestrator --all-containers --tail=200 || true
    echo "=== AGENT WORKLOAD PODS (agyn-workloads) ==="
    kubectl get pods -n agyn-workloads -o wide 2>/dev/null || true
    echo "=== AGENT WORKLOAD EVENTS (agyn-workloads) ==="
    kubectl get events -n agyn-workloads --sort-by='.lastTimestamp' 2>/dev/null || true
    echo "=== AGENT WORKLOAD POD DESCRIBES (agyn-workloads) ==="
    for pod in $(kubectl get pods -n agyn-workloads -o name 2>/dev/null); do
      echo "--- ${pod} ---"
      kubectl describe -n agyn-workloads "${pod}" 2>/dev/null || true
    done
    echo "=== AGENT WORKLOAD LOGS ==="
    for pod in $(kubectl get pods -n agyn-workloads -o name 2>/dev/null); do
      echo "--- $pod ---"
      kubectl logs "$pod" -n agyn-workloads --all-containers --tail=50 2>/dev/null || true
    done
    echo "=== END DIAGNOSTIC LOGS ==="

deployments:
  e2e-runner:
    namespace: ${APP_NAMESPACE}
    helm:
      chart:
        name: component-chart
        repo: https://charts.devspace.sh
      values:
        containers:
          - image: ${E2E_IMAGE}
            env:
              - name: E2E_BASE_URL
                value: "https://tracing.agyn.dev"
              - name: E2E_OIDC_REDIRECT_URI
                value: "${E2E_OIDC_REDIRECT_URI}"
              - name: ARGOS_TOKEN
                value: "${ARGOS_TOKEN}"
              - name: ARGOS_BRANCH
                value: "${ARGOS_BRANCH}"
              - name: ARGOS_COMMIT
                value: "${ARGOS_COMMIT}"
              - name: CI
                value: "${CI}"
              - name: E2E_ORG_ID
                value: "${E2E_ORG_ID}"
              - name: E2E_AUTH_TOKEN
                value: "${E2E_AUTH_TOKEN}"
        labels:
          app.kubernetes.io/name: tracing-app-e2e

commands:
  test-e2e: |-
    devspace run-pipeline test-e2e $@

pipelines:
  dev:
    flags:
      - name: watch
        short: w
        description: "Keep DevSpace running and stream logs"
    run: |-
      disable_argocd_sync
      if [ "$(get_flag "watch")" == "true" ]; then
        start_dev --disable-pod-replace tracing-app
      else
        start_dev --disable-pod-replace tracing-app
        echo "Dev environment ready. Stopping dev session."
        stop_dev tracing-app
      fi

  test-e2e:
    run: |-
      disable_argocd_sync
      deploy_pr_image
      create_deployments e2e-runner
      start_dev e2e-runner &
      sleep 5
      set +e
      exec_container \
        --label-selector "app.kubernetes.io/name=tracing-app-e2e" \
        -n ${APP_NAMESPACE} \
        -- bash -c '
          echo "Waiting for file sync..."
          required_files=(
            /opt/app/data/package.json
            /opt/app/data/pnpm-lock.yaml
            /opt/app/data/index.html
            /opt/app/data/test/e2e/fixtures.ts
            /opt/app/data/test/e2e/oidc-helpers.ts
            /opt/app/data/test/e2e/sign-in-helper.ts
            /opt/app/data/src/App.tsx
            /opt/app/data/src/pages/AgentsRunScreen.tsx
            /opt/app/data/src/main.tsx
            /opt/app/data/src/index.css
            /opt/app/data/src/styles/shadcn-compat.css
          )
          for i in $(seq 1 120); do
            missing=0
            for file in "${required_files[@]}"; do
              if [ ! -f "$file" ]; then
                missing=1
                break
              fi
            done
            if [ "$missing" -eq 0 ]; then
              break
            fi
            sleep 2
          done
          missing_files=()
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              missing_files+=("$file")
            fi
          done
          if [ "${#missing_files[@]}" -ne 0 ]; then
            echo "ERROR: file sync timed out — missing files:${missing_files[*]}"
            exit 1
          fi
          sleep 10
          cd /opt/app/data
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm install --frozen-lockfile
          ARGOS_TOKEN_VALUE="${ARGOS_TOKEN}"
          ARGOS_BRANCH_VALUE="${ARGOS_BRANCH}"
          ARGOS_COMMIT_VALUE="${ARGOS_COMMIT}"
          E2E_ORG_ID_VALUE="${E2E_ORG_ID}"
          E2E_AUTH_TOKEN_VALUE="${E2E_AUTH_TOKEN}"
          E2E_OIDC_REDIRECT_URI_VALUE="${E2E_OIDC_REDIRECT_URI}"
          if [ "$ARGOS_TOKEN_VALUE" = "\${ARGOS_TOKEN}" ]; then
            ARGOS_TOKEN_VALUE=""
          fi
          if [ "$ARGOS_BRANCH_VALUE" = "\${ARGOS_BRANCH}" ]; then
            ARGOS_BRANCH_VALUE=""
          fi
          if [ "$ARGOS_COMMIT_VALUE" = "\${ARGOS_COMMIT}" ]; then
            ARGOS_COMMIT_VALUE=""
          fi
          if [ "$E2E_ORG_ID_VALUE" = "\${E2E_ORG_ID}" ]; then
            E2E_ORG_ID_VALUE=""
          fi
          if [ "$E2E_AUTH_TOKEN_VALUE" = "\${E2E_AUTH_TOKEN}" ]; then
            E2E_AUTH_TOKEN_VALUE=""
          fi
          if [ "$E2E_OIDC_REDIRECT_URI_VALUE" = "\${E2E_OIDC_REDIRECT_URI}" ]; then
            E2E_OIDC_REDIRECT_URI_VALUE=""
          fi
          CI_VALUE="${CI}"
          if [ "$CI_VALUE" = "\${CI}" ]; then
            CI_VALUE=""
          fi
          if [ -z "$ARGOS_TOKEN_VALUE" ]; then
            CI_VALUE=""
          fi
          E2E_BASE_URL="${E2E_BASE_URL}" \
            E2E_ORG_ID="$E2E_ORG_ID_VALUE" \
            E2E_AUTH_TOKEN="$E2E_AUTH_TOKEN_VALUE" \
            E2E_OIDC_REDIRECT_URI="$E2E_OIDC_REDIRECT_URI_VALUE" \
            ARGOS_TOKEN="$ARGOS_TOKEN_VALUE" \
            ARGOS_BRANCH="$ARGOS_BRANCH_VALUE" \
            ARGOS_COMMIT="$ARGOS_COMMIT_VALUE" \
            CI="$CI_VALUE" \
            pnpm test:e2e
          EXIT_CODE=$?
          exit $EXIT_CODE
        '
      EXIT_CODE=$?
      set -e
      if [ "$EXIT_CODE" -ne 0 ]; then
        dump_seed_failure_logs || true
      fi
      stop_dev e2e-runner
      purge_deployments e2e-runner
      exit $EXIT_CODE

hooks:
  - name: restore-argocd-auto-sync
    events:
      - after:dev:tracing-app
    command: bash
    args:
      - -c
      - *restore_argocd_sync

dev:
  tracing-app:
    namespace: ${APP_NAMESPACE}
    labelSelector:
      app.kubernetes.io/name: tracing-app
      app.kubernetes.io/instance: tracing-app
    containers:
      tracing-app:
        sync:
          - path: ./dist:/usr/share/nginx/html
            excludePaths:
              - .git/
              - .devspace/
              - node_modules/
        logs:
          enabled: true
          lastLines: 200
    ports:
      - port: "3000"

  e2e-runner:
    namespace: ${APP_NAMESPACE}
    labelSelector:
      app.kubernetes.io/name: tracing-app-e2e
    command: ["sleep", "infinity"]
    workingDir: /opt/app/data
    sync:
      - path: ./:/opt/app/data
        excludePaths:
          - .git/
          - .devspace/
          - node_modules/
