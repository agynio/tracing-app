version: v2beta1

vars:
  APP_NAMESPACE: platform
  CI:
    source: env
    default: ""

functions:
  disable_argocd_sync: |-
    if kubectl get application tracing-app -n argocd >/dev/null 2>&1; then
      echo "Disabling ArgoCD auto-sync for tracing-app..."
      kubectl patch application tracing-app -n argocd \
        --type merge \
        -p '{"spec":{"syncPolicy":{"automated":null}}}'
      echo "ArgoCD auto-sync disabled."
    else
      echo "WARNING: ArgoCD Application 'tracing-app' not found in argocd namespace."
    fi
  ensure_tracing_app_html_writable: |-
    deploy=$(kubectl get deployment -n ${APP_NAMESPACE} -l app.kubernetes.io/name=tracing-app -o jsonpath='{.items[0].metadata.name}')
    if [ -z "$deploy" ]; then
      echo "WARNING: tracing-app deployment not found in ${APP_NAMESPACE} namespace."
      return 0
    fi
    container=$(kubectl get deployment "$deploy" -n ${APP_NAMESPACE} -o jsonpath='{.spec.template.spec.containers[0].name}')
    if [ -z "$container" ]; then
      echo "WARNING: tracing-app container not found in ${APP_NAMESPACE} namespace."
      return 0
    fi
    image=$(kubectl get deployment "$deploy" -n ${APP_NAMESPACE} -o jsonpath='{.spec.template.spec.containers[0].image}')
    if [ -z "$image" ]; then
      echo "WARNING: tracing-app container image not found in ${APP_NAMESPACE} namespace."
      return 0
    fi
    kubectl patch deployment "$deploy" -n ${APP_NAMESPACE} \
      --type strategic \
      -p "{\"spec\":{\"template\":{\"spec\":{\"securityContext\":{\"fsGroup\":101},\"volumes\":[{\"name\":\"tracing-app-html\",\"emptyDir\":{}}],\"initContainers\":[{\"name\":\"tracing-app-html-init\",\"image\":\"${image}\",\"command\":[\"sh\",\"-c\",\"cp -R /usr/share/nginx/html/. /workdir/\"],\"securityContext\":{\"runAsUser\":101,\"runAsGroup\":101,\"runAsNonRoot\":true,\"allowPrivilegeEscalation\":false},\"volumeMounts\":[{\"name\":\"tracing-app-html\",\"mountPath\":\"/workdir\"}]}],\"containers\":[{\"name\":\"${container}\",\"volumeMounts\":[{\"name\":\"tracing-app-html\",\"mountPath\":\"/usr/share/nginx/html\"}]}]}}}}"
    kubectl rollout status deployment "$deploy" -n ${APP_NAMESPACE} --timeout=600s
  restore_argocd_sync: &restore_argocd_sync |-
    # Skip in CI to avoid ArgoCD self-heal reverting sync/patches during e2e.
    if [ -n "${CI:-}" ]; then
      echo "Skipping ArgoCD auto-sync restore in CI."
      exit 0
    fi
    if kubectl get application tracing-app -n argocd >/dev/null 2>&1; then
      echo "Re-enabling ArgoCD auto-sync for tracing-app..."
      kubectl patch application tracing-app -n argocd \
        --type merge \
        -p '{"spec":{"syncPolicy":{"automated":{"prune":true,"selfHeal":true}}}}'
      echo "ArgoCD auto-sync restored."
    else
      echo "WARNING: ArgoCD Application 'tracing-app' not found in argocd namespace."
    fi

pipelines:
  dev:
    flags:
      - name: watch
        short: w
        description: "Keep DevSpace running and stream logs"
    run: |-
      if [ -n "${CI:-}" ]; then
        if ! command -v corepack >/dev/null 2>&1; then
          echo "ERROR: corepack is required to build tracing-app" >&2
          exit 1
        fi
        corepack enable
        corepack prepare pnpm@10.33.0 --activate
        pnpm install --frozen-lockfile
        pnpm build
      fi
      disable_argocd_sync
      ensure_tracing_app_html_writable
      if [ "$(get_flag "watch")" == "true" ]; then
        start_dev --disable-pod-replace tracing-app
      else
        start_dev --disable-pod-replace tracing-app
        echo "Dev environment ready. Stopping dev session."
        stop_dev tracing-app
      fi

hooks:
  - name: restore-argocd-auto-sync
    events:
      - after:dev:tracing-app
    command: bash
    args:
      - -c
      - *restore_argocd_sync

dev:
  tracing-app:
    namespace: ${APP_NAMESPACE}
    labelSelector:
      app.kubernetes.io/name: tracing-app
      app.kubernetes.io/instance: tracing-app
    ports:
      - port: "3000"
    containers:
      tracing-app:
        sync:
          - path: ./dist:/usr/share/nginx/html
            excludePaths:
              - .git/
              - .devspace/
              - node_modules/
        logs:
          enabled: true
          lastLines: 200
