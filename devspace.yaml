version: v2beta1

vars:
  APP_NAMESPACE: platform
  E2E_IMAGE: mcr.microsoft.com/playwright:v1.58.2-noble

functions:
  disable_argocd_sync: |-
    if kubectl get application tracing-app -n argocd >/dev/null 2>&1; then
      echo "Disabling ArgoCD auto-sync for tracing-app..."
      kubectl patch application tracing-app -n argocd \
        --type merge \
        -p '{"spec":{"syncPolicy":{"automated":null}}}'
      echo "ArgoCD auto-sync disabled."
    else
      echo "WARNING: ArgoCD Application 'tracing-app' not found in argocd namespace."
    fi
  restore_argocd_sync: &restore_argocd_sync |-
    if kubectl get application tracing-app -n argocd >/dev/null 2>&1; then
      echo "Re-enabling ArgoCD auto-sync for tracing-app..."
      kubectl patch application tracing-app -n argocd \
        --type merge \
        -p '{"spec":{"syncPolicy":{"automated":{"prune":true,"selfHeal":true}}}}'
      echo "ArgoCD auto-sync restored."
    else
      echo "WARNING: ArgoCD Application 'tracing-app' not found in argocd namespace."
    fi

deployments:
  e2e-runner:
    namespace: ${APP_NAMESPACE}
    helm:
      chart:
        name: component-chart
        repo: https://charts.devspace.sh
      values:
        containers:
          - image: ${E2E_IMAGE}
            env:
              - name: E2E_BASE_URL
                value: "http://localhost:3000"
              - name: ARGOS_TOKEN
                value: "${ARGOS_TOKEN}"
              - name: ARGOS_BRANCH
                value: "${ARGOS_BRANCH}"
              - name: ARGOS_COMMIT
                value: "${ARGOS_COMMIT}"
              - name: CI
                value: "${CI}"
        labels:
          app.kubernetes.io/name: tracing-app-e2e

commands:
  test-e2e: |-
    devspace run-pipeline test-e2e $@

pipelines:
  dev:
    flags:
      - name: watch
        short: w
        description: "Keep DevSpace running and stream logs"
    run: |-
      disable_argocd_sync
      if [ "$(get_flag "watch")" == "true" ]; then
        start_dev --disable-pod-replace tracing-app
      else
        start_dev --disable-pod-replace tracing-app
        echo "Dev environment ready. Stopping dev session."
        stop_dev tracing-app
      fi

  test-e2e:
    run: |-
      if [ -z "${E2E_GATEWAY_BASE_URL}" ]; then
        export E2E_GATEWAY_BASE_URL="http://gateway-gateway.${APP_NAMESPACE}.svc.cluster.local:8080"
      fi
      if [ -z "${E2E_AUTH_TOKEN}" ]; then
        export E2E_AUTH_TOKEN="$(terraform -chdir=./bootstrap/stacks/platform output -raw cluster_admin_api_token)"
      fi
      if [ -z "${E2E_IDENTITY_ID}" ]; then
        export E2E_IDENTITY_ID="$(terraform -chdir=./bootstrap/stacks/platform output -raw cluster_admin_identity_id)"
      fi
      if [ -z "${E2E_IDENTITY_GRPC_BASE_URL}" ]; then
        export E2E_IDENTITY_GRPC_BASE_URL="http://identity.${APP_NAMESPACE}.svc.cluster.local:50051"
      fi
      if [ -z "${E2E_TRACING_ADDRESS}" ]; then
        export E2E_TRACING_ADDRESS="tracing.${APP_NAMESPACE}.svc.cluster.local:50051"
      fi
      create_deployments e2e-runner
      start_dev e2e-runner &
      sleep 5
      exec_container \
        --label-selector "app.kubernetes.io/name=tracing-app-e2e" \
        -n ${APP_NAMESPACE} \
        -- env E2E_GATEWAY_BASE_URL="${E2E_GATEWAY_BASE_URL}" E2E_AUTH_TOKEN="${E2E_AUTH_TOKEN}" E2E_IDENTITY_ID="${E2E_IDENTITY_ID}" E2E_IDENTITY_GRPC_BASE_URL="${E2E_IDENTITY_GRPC_BASE_URL}" E2E_TRACING_ADDRESS="${E2E_TRACING_ADDRESS}" bash -c '
          echo "Waiting for file sync..."
          required_files=(
            /opt/app/data/package.json
            /opt/app/data/pnpm-lock.yaml
            /opt/app/data/index.html
            /opt/app/data/test/e2e/fixtures.ts
            /opt/app/data/src/App.tsx
            /opt/app/data/src/pages/AgentsRunScreen.tsx
            /opt/app/data/src/main.tsx
            /opt/app/data/src/index.css
            /opt/app/data/src/styles/shadcn-compat.css
          )
          for i in $(seq 1 120); do
            missing=0
            for file in "${required_files[@]}"; do
              if [ ! -f "$file" ]; then
                missing=1
                break
              fi
            done
            if [ "$missing" -eq 0 ]; then
              break
            fi
            sleep 2
          done
          missing_files=()
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              missing_files+=("$file")
            fi
          done
          if [ "${#missing_files[@]}" -ne 0 ]; then
            echo "ERROR: file sync timed out — missing files:${missing_files[*]}"
            exit 1
          fi
          sleep 10
          cd /opt/app/data
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm install --frozen-lockfile
          VITE_API_BASE_URL=/api pnpm build
          pnpm preview --host 0.0.0.0 --port 3000 > /tmp/preview.log 2>&1 &
          PREVIEW_PID=$!
          echo "Waiting for preview server..."
          READY=0
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000 > /dev/null 2>&1 && READY=1 && break
            sleep 2
          done
          if [ "$READY" -ne 1 ]; then
            echo "ERROR: preview server failed to start"
            cat /tmp/preview.log || true
            kill $PREVIEW_PID || true
            exit 1
          fi
          E2E_BASE_URL=http://localhost:3000 ARGOS_TOKEN=${ARGOS_TOKEN} ARGOS_BRANCH=${ARGOS_BRANCH} ARGOS_COMMIT=${ARGOS_COMMIT} CI=true pnpm test:e2e
          EXIT_CODE=$?
          kill $PREVIEW_PID || true
          exit $EXIT_CODE
        '
      EXIT_CODE=$?
      stop_dev e2e-runner
      purge_deployments e2e-runner
      exit $EXIT_CODE

hooks:
  - name: restore-argocd-auto-sync
    events:
      - after:dev:tracing-app
    command: bash
    args:
      - -c
      - *restore_argocd_sync

dev:
  tracing-app:
    namespace: ${APP_NAMESPACE}
    labelSelector:
      app.kubernetes.io/name: tracing-app
      app.kubernetes.io/instance: tracing-app
    containers:
      tracing-app:
        sync:
          - path: ./dist:/usr/share/nginx/html
            excludePaths:
              - .git/
              - .devspace/
              - node_modules/
        logs:
          enabled: true
          lastLines: 200
    ports:
      - port: "3000"

  e2e-runner:
    namespace: ${APP_NAMESPACE}
    labelSelector:
      app.kubernetes.io/name: tracing-app-e2e
    command: ["sleep", "infinity"]
    workingDir: /opt/app/data
    sync:
      - path: ./:/opt/app/data
        excludePaths:
          - .git/
          - .devspace/
          - node_modules/
