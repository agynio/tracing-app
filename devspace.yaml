version: v2beta1

vars:
  APP_NAMESPACE: platform
  E2E_IMAGE: mcr.microsoft.com/playwright:v1.58.2-noble
  E2E_BASE_URL:
    source: env
    default: "https://tracing.agyn.dev"
  ARGOS_TOKEN:
    source: env
    default: ""
  ARGOS_BRANCH:
    source: env
    default: ""
  ARGOS_COMMIT:
    source: env
    default: ""
  E2E_ORG_ID:
    source: env
    default: ""
  E2E_AUTH_TOKEN:
    source: env
    default: ""
  E2E_OIDC_REDIRECT_URI:
    source: env
    default: ""
  CI:
    source: env
    default: ""

functions:
  disable_argocd_sync: |-
    if kubectl get application tracing-app -n argocd >/dev/null 2>&1; then
      echo "Disabling ArgoCD auto-sync for tracing-app..."
      kubectl patch application tracing-app -n argocd \
        --type merge \
        -p '{"spec":{"syncPolicy":{"automated":null}}}'
      echo "ArgoCD auto-sync disabled."
    else
      echo "WARNING: ArgoCD Application 'tracing-app' not found in argocd namespace."
    fi
  ensure_tracing_app_html_writable: |-
    deploy=$(kubectl get deployment -n ${APP_NAMESPACE} -l app.kubernetes.io/name=tracing-app -o jsonpath='{.items[0].metadata.name}')
    if [ -z "$deploy" ]; then
      echo "WARNING: tracing-app deployment not found in ${APP_NAMESPACE} namespace."
      return 0
    fi
    container=$(kubectl get deployment "$deploy" -n ${APP_NAMESPACE} -o jsonpath='{.spec.template.spec.containers[0].name}')
    if [ -z "$container" ]; then
      echo "WARNING: tracing-app container not found in ${APP_NAMESPACE} namespace."
      return 0
    fi
    image=$(kubectl get deployment "$deploy" -n ${APP_NAMESPACE} -o jsonpath='{.spec.template.spec.containers[0].image}')
    if [ -z "$image" ]; then
      echo "WARNING: tracing-app container image not found in ${APP_NAMESPACE} namespace."
      return 0
    fi
    kubectl patch deployment "$deploy" -n ${APP_NAMESPACE} \
      --type strategic \
      -p "{\"spec\":{\"template\":{\"spec\":{\"securityContext\":{\"fsGroup\":101},\"volumes\":[{\"name\":\"tracing-app-html\",\"emptyDir\":{}}],\"initContainers\":[{\"name\":\"tracing-app-html-init\",\"image\":\"${image}\",\"command\":[\"sh\",\"-c\",\"cp -R /usr/share/nginx/html/. /workdir/\"],\"securityContext\":{\"runAsUser\":101,\"runAsGroup\":101,\"runAsNonRoot\":true,\"allowPrivilegeEscalation\":false},\"volumeMounts\":[{\"name\":\"tracing-app-html\",\"mountPath\":\"/workdir\"}]}],\"containers\":[{\"name\":\"${container}\",\"volumeMounts\":[{\"name\":\"tracing-app-html\",\"mountPath\":\"/usr/share/nginx/html\"}]}]}}}}"
    kubectl rollout status deployment "$deploy" -n ${APP_NAMESPACE} --timeout=600s
  restore_argocd_sync: &restore_argocd_sync |-
    # Skip in CI to avoid ArgoCD self-heal reverting sync/patches during e2e.
    if [ -n "${CI:-}" ]; then
      echo "Skipping ArgoCD auto-sync restore in CI."
      exit 0
    fi
    if kubectl get application tracing-app -n argocd >/dev/null 2>&1; then
      echo "Re-enabling ArgoCD auto-sync for tracing-app..."
      kubectl patch application tracing-app -n argocd \
        --type merge \
        -p '{"spec":{"syncPolicy":{"automated":{"prune":true,"selfHeal":true}}}}'
      echo "ArgoCD auto-sync restored."
    else
      echo "WARNING: ArgoCD Application 'tracing-app' not found in argocd namespace."
    fi

deployments:
  e2e-runner:
    namespace: ${APP_NAMESPACE}
    helm:
      chart:
        name: component-chart
        repo: https://charts.devspace.sh
      values:
        containers:
          - image: ${E2E_IMAGE}
            env:
              - name: E2E_BASE_URL
                value: "${E2E_BASE_URL}"
              - name: E2E_OIDC_REDIRECT_URI
                value: "${E2E_OIDC_REDIRECT_URI}"
              - name: E2E_ORG_ID
                value: "${E2E_ORG_ID}"
              - name: E2E_AUTH_TOKEN
                value: "${E2E_AUTH_TOKEN}"
              - name: ARGOS_TOKEN
                value: "${ARGOS_TOKEN}"
              - name: ARGOS_BRANCH
                value: "${ARGOS_BRANCH}"
              - name: ARGOS_COMMIT
                value: "${ARGOS_COMMIT}"
        labels:
          app.kubernetes.io/name: tracing-app-e2e

commands:
  test-e2e: |-
    devspace run-pipeline test-e2e $@

pipelines:
  dev:
    flags:
      - name: watch
        short: w
        description: "Keep DevSpace running and stream logs"
    run: |-
      disable_argocd_sync
      ensure_tracing_app_html_writable
      if [ "$(get_flag "watch")" == "true" ]; then
        start_dev --disable-pod-replace tracing-app
      else
        start_dev --disable-pod-replace tracing-app
        echo "Dev environment ready. Stopping dev session."
        stop_dev tracing-app
      fi

  test-e2e:
    run: |-
      create_deployments e2e-runner
      start_dev e2e-runner &
      sleep 5
      set +e
      exec_container \
        --label-selector "app.kubernetes.io/name=tracing-app-e2e" \
        -n ${APP_NAMESPACE} \
        -- bash -c '
          echo "Waiting for file sync..."
          required_files=(
            /opt/app/data/package.json
            /opt/app/data/pnpm-lock.yaml
            /opt/app/data/index.html
            /opt/app/data/test/e2e/fixtures.ts
            /opt/app/data/test/e2e/oidc-helpers.ts
            /opt/app/data/test/e2e/sign-in-helper.ts
            /opt/app/data/src/App.tsx
            /opt/app/data/src/pages/AgentsRunScreen.tsx
            /opt/app/data/src/main.tsx
            /opt/app/data/src/index.css
            /opt/app/data/src/styles/shadcn-compat.css
          )
          for i in $(seq 1 120); do
            missing=0
            for file in "${required_files[@]}"; do
              if [ ! -f "$file" ]; then
                missing=1
                break
              fi
            done
            if [ "$missing" -eq 0 ]; then
              break
            fi
            sleep 2
          done
          missing_files=()
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              missing_files+=("$file")
            fi
          done
          if [ "${#missing_files[@]}" -ne 0 ]; then
            echo "ERROR: file sync timed out — missing files:${missing_files[*]}"
            exit 1
          fi
          sleep 10
          cd /opt/app/data
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm install --frozen-lockfile
          pnpm test:e2e
          EXIT_CODE=$?
          exit $EXIT_CODE
        '
      EXIT_CODE=$?
      set -e
      stop_dev e2e-runner
      purge_deployments e2e-runner
      exit $EXIT_CODE

hooks:
  - name: restore-argocd-auto-sync
    events:
      - after:dev:tracing-app
    command: bash
    args:
      - -c
      - *restore_argocd_sync

dev:
  tracing-app:
    namespace: ${APP_NAMESPACE}
    labelSelector:
      app.kubernetes.io/name: tracing-app
      app.kubernetes.io/instance: tracing-app
    ports:
      - port: "3000"
    containers:
      tracing-app:
        sync:
          - path: ./dist:/usr/share/nginx/html
            excludePaths:
              - .git/
              - .devspace/
              - node_modules/
        logs:
          enabled: true
          lastLines: 200

  e2e-runner:
    namespace: ${APP_NAMESPACE}
    labelSelector:
      app.kubernetes.io/name: tracing-app-e2e
    command: ["sleep", "infinity"]
    workingDir: /opt/app/data
    sync:
      - path: ./:/opt/app/data
        excludePaths:
          - .git/
          - .devspace/
          - node_modules/
