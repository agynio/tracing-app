name: E2E

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: e2e-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Provision cluster
        uses: agynio/bootstrap/.github/actions/provision@adf1dc4453de5934a9bae8c0f03f7b417e472d79

      - name: Setup DevSpace
        uses: agynio/e2e/.github/actions/setup-devspace@main

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Export bootstrap outputs
        run: |
          set -euo pipefail

          kubeconfig_source="bootstrap/stacks/k8s/.kube/agyn-local-kubeconfig.yaml"
          kubeconfig_target="$GITHUB_WORKSPACE/.kube/agyn-local-kubeconfig.yaml"
          mkdir -p "$(dirname "$kubeconfig_target")"
          cp "$kubeconfig_source" "$kubeconfig_target"
          echo "KUBECONFIG=$kubeconfig_target" >> "$GITHUB_ENV"

          find_state_file() {
            local stack_dir="$1"
            local state_file
            state_file="$stack_dir/state/terraform.tfstate"
            if [ -f "$state_file" ]; then
              echo "$state_file"
              return
            fi

            state_file="$stack_dir/terraform.tfstate"
            if [ -f "$state_file" ]; then
              echo "$state_file"
              return
            fi

            state_file=$(find "$stack_dir" -maxdepth 4 -type f -name "terraform.tfstate" ! -path "*/.terraform/*" | head -n 1)
            if [ -z "$state_file" ]; then
              echo "State file not found under $stack_dir" >&2
              exit 1
            fi
            echo "$state_file"
          }

          read_state_output() {
            local state_file="$1"
            local output_name="$2"
            python3 - "$state_file" "$output_name" <<'PY'
          import json
          import sys

          state_path = sys.argv[1]
          output_name = sys.argv[2]

          with open(state_path, "r", encoding="utf-8") as handle:
              state = json.load(handle)

          outputs = state.get("outputs") or {}
          output = outputs.get(output_name) or {}
          value = output.get("value")

          if value is None or value == "":
              sys.exit(1)

          if isinstance(value, (dict, list)):
              print(json.dumps(value))
          else:
              print(value)
          PY
          }

          k8s_state=$(find_state_file "bootstrap/stacks/k8s")
          domain=$(read_state_output "$k8s_state" domain)
          ingress_port=$(read_state_output "$k8s_state" ingress_port)
          echo "AGYN_BASE_URL=https://gateway.${domain}:${ingress_port}" >> "$GITHUB_ENV"

          platform_state=$(find_state_file "bootstrap/stacks/platform")
          AGYN_API_TOKEN=$(read_state_output "$platform_state" cluster_admin_api_token)
          echo "::add-mask::$AGYN_API_TOKEN"
          echo "AGYN_API_TOKEN=$AGYN_API_TOKEN" >> "$GITHUB_ENV"

          apps_state=$(find_state_file "bootstrap/stacks/apps")
          AGYN_ORGANIZATION_ID=$(read_state_output "$apps_state" bootstrap_organization_id)
          echo "AGYN_ORGANIZATION_ID=$AGYN_ORGANIZATION_ID" >> "$GITHUB_ENV"

          rm -rf bootstrap

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build tracing app
        run: pnpm build
        env:
          VITE_API_BASE_URL: /api

      - name: Generate tracing env.js
        run: |
          set -e

          read_env() {
            local key=$1
            local value
            value=$(kubectl get deployment chat-app -n platform \
              -o jsonpath="{.spec.template.spec.containers[0].env[?(@.name=='${key}')].value}")
            if [ -n "$value" ]; then
              echo "$value"
              return 0
            fi

            local ref_name
            local ref_key
            ref_name=$(kubectl get deployment chat-app -n platform \
              -o jsonpath="{.spec.template.spec.containers[0].env[?(@.name=='${key}')].valueFrom.configMapKeyRef.name}")
            ref_key=$(kubectl get deployment chat-app -n platform \
              -o jsonpath="{.spec.template.spec.containers[0].env[?(@.name=='${key}')].valueFrom.configMapKeyRef.key}")
            if [ -n "$ref_name" ] && [ -n "$ref_key" ]; then
              value=$(kubectl get configmap "$ref_name" -n platform \
                -o jsonpath="{.data.${ref_key}}")
              if [ -n "$value" ]; then
                echo "$value"
                return 0
              fi
            fi

            ref_name=$(kubectl get deployment chat-app -n platform \
              -o jsonpath="{.spec.template.spec.containers[0].env[?(@.name=='${key}')].valueFrom.secretKeyRef.name}")
            ref_key=$(kubectl get deployment chat-app -n platform \
              -o jsonpath="{.spec.template.spec.containers[0].env[?(@.name=='${key}')].valueFrom.secretKeyRef.key}")
            if [ -n "$ref_name" ] && [ -n "$ref_key" ]; then
              value=$(kubectl get secret "$ref_name" -n platform \
                -o jsonpath="{.data.${ref_key}}" 2>/dev/null | base64 --decode || true)
              if [ -n "$value" ]; then
                echo "$value"
                return 0
              fi
            fi

            for ref_name in $(kubectl get deployment chat-app -n platform \
              -o jsonpath='{.spec.template.spec.containers[0].envFrom[?(@.configMapRef)].configMapRef.name}'); do
              value=$(kubectl get configmap "$ref_name" -n platform \
                -o jsonpath="{.data.${key}}" 2>/dev/null || true)
              if [ -n "$value" ]; then
                echo "$value"
                return 0
              fi
            done

            for ref_name in $(kubectl get deployment chat-app -n platform \
              -o jsonpath='{.spec.template.spec.containers[0].envFrom[?(@.secretRef)].secretRef.name}'); do
              value=$(kubectl get secret "$ref_name" -n platform \
                -o jsonpath="{.data.${key}}" 2>/dev/null | base64 --decode || true)
              if [ -n "$value" ]; then
                echo "$value"
                return 0
              fi
            done

            return 1
          }

          escape_js() {
            printf '%s' "$1" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g'
          }

          OIDC_AUTHORITY=$(read_env OIDC_AUTHORITY || true)
          OIDC_CLIENT_ID=$(read_env OIDC_CLIENT_ID || true)
          OIDC_SCOPE=$(read_env OIDC_SCOPE || true)
          if [ -z "$OIDC_AUTHORITY" ] || [ -z "$OIDC_CLIENT_ID" ] || [ -z "$OIDC_SCOPE" ]; then
            echo "ERROR: Failed to read OIDC env vars from chat-app deployment"
            exit 1
          fi

          {
            printf 'E2E_OIDC_AUTHORITY=%s\n' "$OIDC_AUTHORITY"
            printf 'E2E_OIDC_CLIENT_ID=%s\n' "$OIDC_CLIENT_ID"
            printf 'E2E_OIDC_SCOPE=%s\n' "$OIDC_SCOPE"
          } >> "$GITHUB_ENV"

          mkdir -p dist
          cat > dist/env.js <<EOF
          window.__ENV__ = {
            API_BASE_URL: "/api",
            OIDC_AUTHORITY: "$(escape_js "$OIDC_AUTHORITY")",
            OIDC_CLIENT_ID: "$(escape_js "$OIDC_CLIENT_ID")",
            OIDC_SCOPE: "$(escape_js "$OIDC_SCOPE")"
          };
          EOF

      - name: Deploy tracing app from source
        run: devspace dev -n platform

      - name: Remove bootstrap state
        run: rm -rf bootstrap

      - name: Checkout e2e repository
        uses: actions/checkout@v4
        with:
          repository: agynio/e2e
          ref: main
          path: e2e

      - name: Install PyYAML
        run: |
          set -euo pipefail
          if python3 - <<'PY'
          import yaml
          PY
          then
            exit 0
          fi
          if command -v apt-get >/dev/null 2>&1; then
            if command -v sudo >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y python3-yaml
            else
              apt-get update
              apt-get install -y python3-yaml
            fi
          else
            python3 -m pip install --user --break-system-packages pyyaml
          fi

      - name: Prepare E2E environment
        run: |
          set -euo pipefail

          echo "E2E_BASE_URL=http://tracing-app.platform.svc.cluster.local:3000" >> "$GITHUB_ENV"
          echo "E2E_MOCK_AUTH=true" >> "$GITHUB_ENV"
          echo "E2E_MOCK_DATA=true" >> "$GITHUB_ENV"

          if [ -z "${AGYN_BASE_URL:-}" ]; then
            echo "AGYN_BASE_URL not set." >&2
            exit 1
          fi
          if ! gateway_status=$(curl -sS -k -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 20 "${AGYN_BASE_URL}"); then
            echo "AGYN_BASE_URL ${AGYN_BASE_URL} is not reachable from the GitHub runner." >&2
            exit 1
          fi
          if [ "$gateway_status" = "000" ]; then
            echo "AGYN_BASE_URL ${AGYN_BASE_URL} is not reachable from the GitHub runner." >&2
            exit 1
          fi

          if [ -z "${AGYN_API_TOKEN:-}" ]; then
            echo "AGYN_API_TOKEN not set." >&2
            exit 1
          fi
          if [ -z "${AGYN_ORGANIZATION_ID:-}" ]; then
            echo "AGYN_ORGANIZATION_ID not set." >&2
            exit 1
          fi

          if [ -z "${AGYN_AGENT_IMAGE:-}" ]; then
            AGYN_AGENT_IMAGE="ghcr.io/agynio/agent-runtime:v1.0.0"
            echo "AGYN_AGENT_IMAGE=$AGYN_AGENT_IMAGE" >> "$GITHUB_ENV"
          fi

          if [ -z "${AGYN_AGENT_INIT_IMAGE:-}" ]; then
            AGYN_AGENT_INIT_IMAGE="ghcr.io/agynio/agent-init:v1.0.0"
            echo "AGYN_AGENT_INIT_IMAGE=$AGYN_AGENT_INIT_IMAGE" >> "$GITHUB_ENV"
          fi

          if [ -z "${AGYN_MODEL_ID:-}" ]; then
            list_models_payload=$(cat <<EOF
          {"organizationId":"${AGYN_ORGANIZATION_ID}","llmProviderId":"","pageSize":200,"pageToken":""}
          EOF
          )
            if ! model_id=$(curl -fsS -k \
              -H 'Content-Type: application/json' \
              -H 'Connect-Protocol-Version: 1' \
              -H "Authorization: Bearer ${AGYN_API_TOKEN}" \
              -d "$list_models_payload" \
              "${AGYN_BASE_URL}/agynio.api.gateway.v1.LLMGateway/ListModels" \
              | python3 -c "$(cat <<'PY'
          import json
          import sys

          try:
              payload = json.load(sys.stdin)
          except json.JSONDecodeError as exc:
              print(f"Invalid JSON in ListModels response: {exc}", file=sys.stderr)
              sys.exit(1)

          models = payload.get("models") or []
          for model in models:
              meta = model.get("meta") or {}
              model_id = meta.get("id") or model.get("id") or ""
              if model_id:
                  print(model_id)
                  break
          PY
          )"); then
              echo "Failed to parse ListModels response." >&2
              exit 1
            fi

            if [ -z "$model_id" ]; then
              providers_payload=$(cat <<EOF
          {"organizationId":"${AGYN_ORGANIZATION_ID}","pageSize":200,"pageToken":""}
          EOF
          )
              if ! provider_id=$(curl -fsS -k \
                -H 'Content-Type: application/json' \
                -H 'Connect-Protocol-Version: 1' \
                -H "Authorization: Bearer ${AGYN_API_TOKEN}" \
                -d "$providers_payload" \
                "${AGYN_BASE_URL}/agynio.api.gateway.v1.LLMGateway/ListLLMProviders" \
                | python3 -c "$(cat <<'PY'
          import json
          import sys

          try:
              payload = json.load(sys.stdin)
          except json.JSONDecodeError as exc:
              print(f"Invalid JSON in ListLLMProviders response: {exc}", file=sys.stderr)
              sys.exit(1)

          providers = payload.get("providers") or []
          for provider in providers:
              meta = provider.get("meta") or {}
              provider_id = meta.get("id") or provider.get("id") or ""
              if provider_id:
                  print(provider_id)
                  break
          PY
          )"); then
                echo "Failed to parse ListLLMProviders response." >&2
                exit 1
              fi

              if [ -z "$provider_id" ]; then
                now=$(date +%s)
                create_provider_payload=$(cat <<EOF
          {"endpoint":"https://llm.e2e.agyn.dev/${now}","authMethod":"AUTH_METHOD_BEARER","token":"e2e-token-${now}","organizationId":"${AGYN_ORGANIZATION_ID}"}
          EOF
          )
                if ! provider_id=$(curl -fsS -k \
                  -H 'Content-Type: application/json' \
                  -H 'Connect-Protocol-Version: 1' \
                  -H "Authorization: Bearer ${AGYN_API_TOKEN}" \
                  -d "$create_provider_payload" \
                  "${AGYN_BASE_URL}/agynio.api.gateway.v1.LLMGateway/CreateLLMProvider" \
                  | python3 -c "$(cat <<'PY'
          import json
          import sys

          try:
              payload = json.load(sys.stdin)
          except json.JSONDecodeError as exc:
              print(f"Invalid JSON in CreateLLMProvider response: {exc}", file=sys.stderr)
              sys.exit(1)

          provider = payload.get("provider") or {}
          meta = provider.get("meta") or {}
          provider_id = meta.get("id") or provider.get("id") or ""
          if provider_id:
              print(provider_id)
          PY
          )"); then
                  echo "Failed to parse CreateLLMProvider response." >&2
                  exit 1
                fi
                if [ -n "$provider_id" ]; then
                  echo "Created LLM provider ${provider_id}"
                fi
              fi

              if [ -z "$provider_id" ]; then
                echo "Unable to determine LLM provider ID." >&2
                exit 1
              fi

              now=$(date +%s)
              create_model_payload=$(cat <<EOF
          {"name":"E2E Model ${now}","llmProviderId":"${provider_id}","remoteName":"gpt-4o-mini","organizationId":"${AGYN_ORGANIZATION_ID}"}
          EOF
          )
              if ! model_id=$(curl -fsS -k \
                -H 'Content-Type: application/json' \
                -H 'Connect-Protocol-Version: 1' \
                -H "Authorization: Bearer ${AGYN_API_TOKEN}" \
                -d "$create_model_payload" \
                "${AGYN_BASE_URL}/agynio.api.gateway.v1.LLMGateway/CreateModel" \
                | python3 -c "$(cat <<'PY'
          import json
          import sys

          try:
              payload = json.load(sys.stdin)
          except json.JSONDecodeError as exc:
              print(f"Invalid JSON in CreateModel response: {exc}", file=sys.stderr)
              sys.exit(1)

          model = payload.get("model") or {}
          meta = model.get("meta") or {}
          model_id = meta.get("id") or model.get("id") or ""
          if model_id:
              print(model_id)
          PY
          )"); then
                echo "Failed to parse CreateModel response." >&2
                exit 1
              fi
              if [ -n "$model_id" ]; then
                echo "Created LLM model ${model_id}"
              fi
            fi

            if [ -z "$model_id" ]; then
              echo "Unable to determine LLM model ID." >&2
              exit 1
            fi

            echo "AGYN_MODEL_ID=$model_id" >> "$GITHUB_ENV"
          fi
      - name: Run DevSpace E2E pipeline
        id: run
        run: |
          set -euo pipefail
          tags=()
          tags+=("svc_tracing_app")

          unique_tags=()
          declare -A seen=()
          for tag in "${tags[@]}"; do
            if [ -z "${seen[$tag]+x}" ]; then
              unique_tags+=("$tag")
              seen[$tag]=1
            fi
          done

          namespace="${DEVSPACE_NAMESPACE:-platform}"
          cd "$GITHUB_WORKSPACE/e2e"

          export DEVSPACE_NAMESPACE="$namespace"

          set +e
          if [ "${#unique_tags[@]}" -eq 0 ]; then
            devspace run test-e2e
            exit_code=$?
          else
            declare -A seen_run=()
            tag_args=()
            for tag in "${unique_tags[@]}"; do
              if [ -z "${seen_run[$tag]+x}" ]; then
                tag_args+=("--tag" "$tag")
                seen_run[$tag]=1
              fi
            done
            devspace run test-e2e "${tag_args[@]}"
            exit_code=$?
          fi
          set -e

          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Capture diagnostics
        if: ${{ steps.run.outputs.exit_code != '0' }}
        run: |
          set -euo pipefail
          namespace="${DEVSPACE_NAMESPACE:-platform}"
          diagnostics_dir="$GITHUB_WORKSPACE/e2e/.diagnostics"
          mkdir -p "$diagnostics_dir/logs"
          kubectl get pods -n "$namespace" -o wide > "$diagnostics_dir/pods-all.txt" || true
          kubectl get pods -n "$namespace" -l app.kubernetes.io/managed-by=e2e -o wide > "$diagnostics_dir/pods.txt" || true
          kubectl describe pods -n "$namespace" -l app.kubernetes.io/managed-by=e2e > "$diagnostics_dir/describe-pods.txt" || true
          kubectl get events -n "$namespace" --sort-by=.metadata.creationTimestamp > "$diagnostics_dir/events.txt" || true
          pods=$(kubectl get pods -n "$namespace" -l app.kubernetes.io/managed-by=e2e -o name 2>/dev/null || true)
          for pod in $pods; do
            pod_name=$(echo "$pod" | sed 's|pod/||')
            kubectl logs -n "$namespace" --all-containers --prefix "$pod" > "$diagnostics_dir/logs/${pod_name}.log" 2>&1 || true
          done

      - name: Upload test artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-tracing_app
          path: |
            e2e/.artifacts/
            e2e/.diagnostics/
          if-no-files-found: warn

      - name: Fail if tests failed
        if: ${{ steps.run.outputs.exit_code != '0' }}
        run: exit 1
