name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
        env:
          VITE_API_BASE_URL: /api

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build
    steps:
      - name: Free disk space
        run: |
          # Remove Java (JDKs)
          sudo rm -rf /usr/lib/jvm

          # Remove .NET SDKs
          sudo rm -rf /usr/share/dotnet

          # Remove Swift toolchain
          sudo rm -rf /usr/share/swift

          # Remove Haskell (GHC)
          sudo rm -rf /usr/local/.ghcup

          # Remove Julia
          sudo rm -rf /usr/local/julia*

          # Remove Android SDKs
          sudo rm -rf /usr/local/lib/android

      - name: Checkout service repo
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
        env:
          VITE_API_BASE_URL: /api

      - name: Checkout bootstrap
        uses: actions/checkout@v4
        with:
          repository: agynio/bootstrap
          path: bootstrap

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.28.7

      - name: Install k3d
        run: |
          curl -s https://raw.githubusercontent.com/k3d-io/k3d/v5.7.5/install.sh | TAG=v5.7.5 bash
          k3d version

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Install DevSpace
        run: |
          curl -fsSL -o devspace "https://github.com/loft-sh/devspace/releases/download/v6.3.20/devspace-linux-amd64"
          sudo install -c -m 0755 devspace /usr/local/bin
          devspace version

      - name: Provision cluster
        working-directory: bootstrap
        run: ./apply.sh -y

      - name: Verify cluster health
        working-directory: bootstrap
        run: ./.github/scripts/verify_platform_health.sh

      - name: Generate tracing env.js
        env:
          KUBECONFIG: ${{ github.workspace }}/bootstrap/stacks/k8s/.kube/agyn-local-kubeconfig.yaml
        run: |
          set -e

          read_env() {
            local key=$1
            local value
            value=$(kubectl get deployment chat-app -n platform \
              -o jsonpath="{.spec.template.spec.containers[0].env[?(@.name=='${key}')].value}")
            if [ -n "$value" ]; then
              echo "$value"
              return 0
            fi

            local ref_name
            local ref_key
            ref_name=$(kubectl get deployment chat-app -n platform \
              -o jsonpath="{.spec.template.spec.containers[0].env[?(@.name=='${key}')].valueFrom.configMapKeyRef.name}")
            ref_key=$(kubectl get deployment chat-app -n platform \
              -o jsonpath="{.spec.template.spec.containers[0].env[?(@.name=='${key}')].valueFrom.configMapKeyRef.key}")
            if [ -n "$ref_name" ] && [ -n "$ref_key" ]; then
              value=$(kubectl get configmap "$ref_name" -n platform \
                -o jsonpath="{.data.${ref_key}}")
              if [ -n "$value" ]; then
                echo "$value"
                return 0
              fi
            fi

            ref_name=$(kubectl get deployment chat-app -n platform \
              -o jsonpath="{.spec.template.spec.containers[0].env[?(@.name=='${key}')].valueFrom.secretKeyRef.name}")
            ref_key=$(kubectl get deployment chat-app -n platform \
              -o jsonpath="{.spec.template.spec.containers[0].env[?(@.name=='${key}')].valueFrom.secretKeyRef.key}")
            if [ -n "$ref_name" ] && [ -n "$ref_key" ]; then
              value=$(kubectl get secret "$ref_name" -n platform \
                -o jsonpath="{.data.${ref_key}}" 2>/dev/null | base64 --decode || true)
              if [ -n "$value" ]; then
                echo "$value"
                return 0
              fi
            fi

            for ref_name in $(kubectl get deployment chat-app -n platform \
              -o jsonpath='{.spec.template.spec.containers[0].envFrom[?(@.configMapRef)].configMapRef.name}'); do
              value=$(kubectl get configmap "$ref_name" -n platform \
                -o jsonpath="{.data.${key}}" 2>/dev/null || true)
              if [ -n "$value" ]; then
                echo "$value"
                return 0
              fi
            done

            for ref_name in $(kubectl get deployment chat-app -n platform \
              -o jsonpath='{.spec.template.spec.containers[0].envFrom[?(@.secretRef)].secretRef.name}'); do
              value=$(kubectl get secret "$ref_name" -n platform \
                -o jsonpath="{.data.${key}}" 2>/dev/null | base64 --decode || true)
              if [ -n "$value" ]; then
                echo "$value"
                return 0
              fi
            done

            return 1
          }

          escape_js() {
            printf '%s' "$1" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g'
          }

          OIDC_AUTHORITY=$(read_env OIDC_AUTHORITY || true)
          OIDC_CLIENT_ID=$(read_env OIDC_CLIENT_ID || true)
          OIDC_SCOPE=$(read_env OIDC_SCOPE || true)
          if [ -z "$OIDC_AUTHORITY" ] || [ -z "$OIDC_CLIENT_ID" ] || [ -z "$OIDC_SCOPE" ]; then
            echo "ERROR: Failed to read OIDC env vars from chat-app deployment"
            exit 1
          fi

          {
            printf 'E2E_OIDC_AUTHORITY=%s\n' "$OIDC_AUTHORITY"
            printf 'E2E_OIDC_CLIENT_ID=%s\n' "$OIDC_CLIENT_ID"
            printf 'E2E_OIDC_SCOPE=%s\n' "$OIDC_SCOPE"
          } >> "$GITHUB_ENV"

          mkdir -p dist
          cat > dist/env.js <<EOF
          window.__ENV__ = {
            API_BASE_URL: "/api",
            OIDC_AUTHORITY: "$(escape_js "$OIDC_AUTHORITY")",
            OIDC_CLIENT_ID: "$(escape_js "$OIDC_CLIENT_ID")",
            OIDC_SCOPE: "$(escape_js "$OIDC_SCOPE")"
          };
          EOF

      - name: Sync tracing app via DevSpace
        env:
          KUBECONFIG: ${{ github.workspace }}/bootstrap/stacks/k8s/.kube/agyn-local-kubeconfig.yaml
        run: devspace dev

      - name: Run E2E tests
        env:
          KUBECONFIG: ${{ github.workspace }}/bootstrap/stacks/k8s/.kube/agyn-local-kubeconfig.yaml
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
          ARGOS_BRANCH: ${{ github.head_ref || github.ref_name }}
          ARGOS_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: devspace run test-e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
